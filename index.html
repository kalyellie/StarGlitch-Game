<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Star Glitch: XYRATH-9</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/@solana/web3.js@1.95.3/lib/index.iife.min.js"></script>
  <script src="https://unpkg.com/@solana/pay@0.2.5/dist/index.iife.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; color: #0f0; font-family: 'Courier New', monospace; text-align: center; overflow: hidden; touch-action: none; }
    .tentacle { font-size: 5em; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.3); } }
    .container { padding: 20px; }
    h1 { font-size: 1.8em; margin: 10px 0; }
    .stats { margin: 15px 0; font-size: 1.2em; }
    .btn { background: #0f0; color: #000; border: none; padding: 15px 30px; font-size: 1.3em; margin: 10px; border-radius: 10px; cursor: pointer; }
    .hodl-area { width: 100vw; height: 50vh; background: rgba(0,255,0,0.1); display: flex; align-items: center; justify-content: center; font-size: 2em; margin: 20px 0; }
    .jackpot { color: #ff0; font-weight: bold; }
    .hidden { display: none; }
    .pay-btn { background: #00f; color: #fff; }
  </style>
</head>
<body>
  <div class="container">
    <div class="tentacle">Squid</div>
    <h1>STAR GLITCH: XYRATH-9</h1>
    <p id="status">Conectando...</p>

    <div id="connectSection">
      <button class="btn" onclick="connectPhantom()">CONECTAR PHANTOM</button>
    </div>

    <div id="gameSection" class="hidden">
      <div class="stats">
        Fragmentos: <span id="fragments">0</span><br>
        HODL Streak: <span id="streak">0</span>s<br>
        Jackpot: <span class="jackpot">100 $STARG</span>
      </div>

      <div class="hodl-area" id="hodlArea">
        <div id="hodlText">¡HODLEA AQUÍ!</div>
      </div>

      <button class="btn pay-btn" onclick="payEntry()">PAGAR 0.1 $STARG</button>
      <button class="btn" onclick="cashOut()">COBRAR $STARG</button>
    </div>
  </div>

  <script>
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();

    let wallet, connection, fragments = 0, streak = 0, interval, entryPaid = false;

    // CONECTAR PHANTOM
    async function connectPhantom() {
      try {
        const keypair = Solana.Keypair.generate();
        const dappKey = keypair.publicKey.toBase58();
        const redirect = encodeURIComponent(window.location.href);
        const params = new URLSearchParams({
          app_url: window.location.origin,
          redirect_link: redirect,
          dapp_encryption_public_key: dappKey,
          cluster: 'mainnet-beta'
        });
        Telegram.WebApp.openLink(`https://phantom.app/ul/v1/connect?${params.toString()}`);
      } catch (err) {
        document.getElementById("status").innerText = "Error";
      }
    }

    // DETECTAR REGRESO
    setInterval(() => {
      const params = new URLSearchParams(window.location.search);
      if (params.get('phantom_encryption_public_key') && !wallet) {
        wallet = "5FHwkrdxntdEfV24..."; // Reemplazar con desencriptado real
        connection = new Solana.Connection("https://api.mainnet-beta.solana.com");
        document.getElementById("status").innerText = `Solana: ${wallet.slice(0,6)}...`;
        document.getElementById("connectSection").classList.add("hidden");
        document.getElementById("gameSection").classList.remove("hidden");
        startHODL();
      }
    }, 1000);

    // PAGAR ENTRADA
    async function payEntry() {
      if (!entryPaid) {
        const paymentRequest = {
          recipient: new Solana.PublicKey("TU_WALLET_AQUI"),
          amount: new Solana.BN(100000000), // 0.1 SOL
          splToken: new Solana.PublicKey("8o3ziaJUWVNhcryJ1q2nnFR21D7Zx3PHzjiPH8J4azUm"),
          reference: new Solana.PublicKey(wallet),
          label: "Star Glitch Entry",
          message: "0.1 $STARG para jugar"
        };
        const { signature } = await SolanaPay.create(paymentRequest).connect({ wallet });
        alert(`Pagado! Tx: ${signature.slice(0,8)}...`);
        entryPaid = true;
      }
    }

    // COBRAR
    function cashOut() {
      if (fragments < 1000) return alert("1000 fragmentos mínimo");
      alert(`Cobras ${(fragments/10000).toFixed(3)} $STARG`);
      // Enviar a backend
    }

    // HODL
    function startHODL() {
      const area = document.getElementById("hodlArea");
      area.addEventListener("touchstart", startStreak);
      area.addEventListener("mousedown", startStreak);
      area.addEventListener("touchend", endStreak);
      area.addEventListener("mouseup", endStreak);
    }

    function startStreak() {
      streak = 0;
      document.getElementById("hodlText").innerText = "¡HODLEANDO!";
      interval = setInterval(() => {
        streak++;
        fragments += streak;
        document.getElementById("streak").innerText = streak;
        document.getElementById("fragments").innerText = fragments;
        if (streak % 10 === 0) addTentacle();
      }, 1000);
    }

    function endStreak() {
      clearInterval(interval);
      document.getElementById("hodlText").innerText = "¡HODLEA AQUÍ!";
      if (streak > 5) alert(`¡${streak}s! Ganaste ${(streak/10).toFixed(1)} $STARG`);
    }

    function addTentacle() {
      const t = document.createElement("div");
      t.innerText = "Squid"; t.style.position = "absolute"; t.style.fontSize = "3em";
      t.style.left = Math.random() * 80 + "%"; t.style.top = "-50px";
      t.style.animation = "fall 3s linear"; document.body.appendChild(t);
      setTimeout(() => t.remove(), 3000);
    }

    const style = document.createElement('style');
    style.innerHTML = `@keyframes fall { from { top: -50px; } to { top: 100vh; } }`;
    document.head.appendChild(style);
  </script>
</body>
</html>
