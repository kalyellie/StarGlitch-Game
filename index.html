<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Star Glitch: XYRATH-9</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/@solana/web3.js@1.95.3/lib/index.iife.min.js"></script>
  <script src="https://unpkg.com/web3@1.10.4/dist/web3.min.js"></script>
  <script src="https://unpkg.com/@solana/spl-token@0.4.8/lib/index.iife.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; color: #0f0; font-family: 'Courier New', monospace; text-align: center; overflow: hidden; touch-action: none; }
    .tentacle { font-size: 5em; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.3); } }
    .container { padding: 20px; }
    h1 { font-size: 1.8em; margin: 10px 0; }
    .stats { margin: 15px 0; font-size: 1.2em; }
    .btn { background: #0f0; color: #000; border: none; padding: 15px 30px; font-size: 1.3em; margin: 10px; border-radius: 10px; cursor: pointer; }
    .hodl-area { width: 100vw; height: 50vh; background: rgba(0,255,0,0.1); display: flex; align-items: center; justify-content: center; font-size: 2em; margin: 20px 0; }
    .jackpot { color: #ff0; font-weight: bold; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="tentacle">Squid</div>
    <h1>STAR GLITCH: XYRATH-9</h1>
    <p id="status">Conecta tu wallet</p>

    <div id="connectSection">
      <button class="btn" onclick="connectWallet('phantom')">PHANTOM (Solana)</button>
      <button class="btn" onclick="connectWallet('metamask')">METAMASK (World Chain)</button>
    </div>

    <div id="paymentSection" class="hidden">
      <button class="btn" onclick="payToPlay()">PAGAR 0.1 $STARG</button>
    </div>

    <div id="gameSection" class="hidden">
      <div class="stats">
        Fragmentos: <span id="fragments">0</span><br>
        HODL Streak: <span id="streak">0</span>s<br>
        Jackpot: <span class="jackpot">100 $STARG</span>
      </div>
      <div class="hodl-area" id="hodlArea"><div id="hodlText">¡HODLEA AQUÍ!</div></div>
      <button class="btn" onclick="cashOut()">COBRAR $STARG</button>
      <button class="btn" onclick="resetGame()">RESET</button>
    </div>
  </div>

  <script>
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();

    // === CONTRATOS ACTUALIZADOS ===
    const DEV_WALLET_SOLANA = 'Ccp1SJut7ycZbAFNtYjmmGcGUgx7Gipji4R5BvfqfaQS';
    const DEV_WALLET_WORLD = '0xd7fa97a54fe292df8463e89b8dbf9e6d2ec14bc5';
    const SOLANA_CA = '3nhJUCbLwoT7w1iUWE1MUER1YbUmqJxeqBVpsBZFpump'; // NUEVO PUMP.FUN
    const WORLD_CA = '0xa3Ad51ebd02690317b34f83329F082F9b4f84683';
    const SOLANA_RPC = 'https://api.mainnet-beta.solana.com';
    const WORLD_RPC = 'https://worldchain-mainnet.g.alchemy.com/public';
    const SOLANA_DECIMALS = 6;

    let wallet, network, provider, fragments = 0, streak = 0, interval;

    // === CONEXIÓN CON DEEP LINK + POLLING ===
    async function connectWallet(type) {
      const session = Date.now();
      localStorage.setItem('connect_session', session);
      localStorage.setItem('connect_type', type);

      let link;
      if (type === 'phantom') {
        const redirect = encodeURIComponent(`${window.location.href}?session=${session}&network=solana`);
        link = `https://phantom.app/ul/browse/${redirect}?ref=star-glitch`;
      } else {
        const redirect = encodeURIComponent(`${window.location.href}?session=${session}&network=world`);
        link = `https://metamask.app.link/dapp/${window.location.host}?redirect=${redirect}`;
      }

      document.getElementById("status").innerText = `Abriendo ${type === 'phantom' ? 'Phantom' : 'MetaMask'}...`;
      Telegram.WebApp.openLink(link);

      // Polling para detectar regreso
      const check = setInterval(() => {
        const url = new URL(window.location);
        const s = url.searchParams.get('session');
        const n = url.searchParams.get('network');
        const stored = localStorage.getItem('connect_session');

        if (s && s === stored) {
          clearInterval(check);
          url.search = '';
          history.replaceState({}, '', url);
          localStorage.removeItem('connect_session');
          localStorage.removeItem('connect_type');

          // Simular conexión (en producción: usar window.solana o window.ethereum)
          if (n === 'solana') {
            wallet = '5FHwk...xyz';
            network = 'Solana';
          } else {
            wallet = '0xd7fa...14bc5';
            network = 'World Chain';
          }
          showPayment();
        }
      }, 800);
    }

    function showPayment() {
      document.getElementById("status").innerText = `${network}: ${wallet.slice(0,6)}...${wallet.slice(-4)}`;
      document.getElementById("connectSection").classList.add("hidden");
      document.getElementById("paymentSection").classList.remove("hidden");
      loadState();
    }

    async function payToPlay() {
      document.getElementById("status").innerText = "Procesando pago...";
      const amount = 0.1 * 10**SOLANA_DECIMALS;

      try {
        if (network === 'Solana') {
          const connection = new Solana.Connection(SOLANA_RPC, 'confirmed');
          const from = new Solana.PublicKey(wallet);
          const to = new Solana.PublicKey(DEV_WALLET_SOLANA);
          const mint = new Solana.PublicKey(SOLANA_CA);

          const transaction = new Solana.Transaction().add(
            SplToken.createTransferInstruction(
              SplToken.TOKEN_PROGRAM_ID,
              from,
              to,
              from,
              [],
              amount
            )
          );

          // En producción: usar window.solana.signTransaction
          alert("Transacción lista. Firma en Phantom.");
        }

        setTimeout(() => {
          document.getElementById("status").innerText = "¡Pago recibido!";
          document.getElementById("paymentSection").classList.add("hidden");
          document.getElementById("gameSection").classList.remove("hidden");
          startHODL();
        }, 2000);
      } catch (err) {
        document.getElementById("status").innerText = "Error en pago";
      }
    }

    function startHODL() {
      const area = document.getElementById("hodlArea");
      area.addEventListener("touchstart", startStreak);
      area.addEventListener("mousedown", startStreak);
      area.addEventListener("touchend", endStreak);
      area.addEventListener("mouseup", endStreak);
    }

    function startStreak() {
      streak = 0;
      document.getElementById("hodlText").innerText = "¡HODLEANDO!";
      interval = setInterval(() => {
        streak++;
        fragments += streak * (streak > 30 ? 2 : 1);
        document.getElementById("streak").innerText = streak;
        document.getElementById("fragments").innerText = fragments;
        saveState();
        if (streak % 10 === 0) addTentacle();
      }, 1000);
    }

    function endStreak() {
      clearInterval(interval);
      document.getElementById("hodlText").innerText = "¡HODLEA AQUÍ!";
      if (streak > 5) alert(`¡${streak}s! Ganaste ${(streak/10).toFixed(1)} $STARG`);
      saveState();
    }

    function cashOut() {
      if (fragments < 100) return alert("100 fragmentos mínimo");
      alert(`Cobras ${(fragments/1000).toFixed(3)} $STARG a ${wallet}`);
      resetGame();
    }

    function addTentacle() {
      const t = document.createElement("div");
      t.innerText = "Squid"; t.style.position = "absolute"; t.style.fontSize = "3em";
      t.style.left = Math.random() * 80 + "%"; t.style.top = "-50px";
      t.style.animation = "fall 3s linear"; document.body.appendChild(t);
      setTimeout(() => t.remove(), 3000);
    }

    function saveState() {
      localStorage.setItem('fragments', fragments);
      localStorage.setItem('streak', streak);
    }

    function loadState() {
      fragments = parseInt(localStorage.getItem('fragments') || 0);
      streak = parseInt(localStorage.getItem('streak') || 0);
      document.getElementById("fragments").innerText = fragments;
      document.getElementById("streak").innerText = streak;
    }

    function resetGame() {
      fragments = 0; streak = 0;
      document.getElementById("fragments").innerText = 0;
      document.getElementById("streak").innerText = 0;
      localStorage.clear();
      document.getElementById("status").innerText = "Juego reseteado";
    }

    const style = document.createElement('style');
    style.innerHTML = `@keyframes fall { from { top: -50px; } to { top: 100vh; } }`;
    document.head.appendChild(style);

    // Cargar estado al inicio
    loadState();
  </script>
</body>
</html>
