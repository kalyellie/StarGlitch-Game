<script>
  async function connectWallet() {
    let provider;

    // 1. Phantom (Solana)
    if (window.solana && window.solana.isPhantom) {
      provider = window.solana;
      try {
        await provider.connect();
        wallet = provider.publicKey.toString();
        network = "Solana";
      } catch (e) { alert("Phantom cancelado"); return; }
    }
    // 2. MetaMask (World Chain)
    else if (window.ethereum) {
      provider = window.ethereum;
      try {
        await provider.request({ method: 'eth_requestAccounts' });
        const chainId = await provider.request({ method: 'eth_chainId' });
        if (chainId === '0x1e0') { // 480 en hex
          wallet = provider.selectedAddress;
          network = "World Chain";
        } else {
          alert("Cambia a World Chain en MetaMask");
          return;
        }
      } catch (e) { alert("MetaMask cancelado"); return; }
    }
    else {
      alert("Instala Phantom (Solana) o MetaMask (World Chain)");
      return;
    }

    document.getElementById("status").innerText = `${network}: ${wallet.slice(0,6)}...${wallet.slice(-4)}`;
    document.getElementById("connectSection").classList.add("hidden");
    document.getElementById("gameSection").classList.remove("hidden");
    startHODL();
  }
</script>
