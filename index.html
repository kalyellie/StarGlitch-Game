<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STAR GLITCH: XYRATH-9</title>
  <script src="https://unpkg.com/@solana/web3.js@1.95.3/lib/index.iife.min.js"></script>
  <script src="https://unpkg.com/web3@1.10.4/dist/web3.min.js"></script>
  <script src="https://unpkg.com/@solana/spl-token@0.4.8/lib/index.iife.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap');
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#000; color:#0f0; font-family:'Orbitron',monospace; text-align:center; overflow-x:hidden; min-height:100vh; }
    .tentacle-core { font-size:5em; animation:pulse 1.5s infinite; text-shadow:0 0 25px #0f0; margin:15px 0; }
    @keyframes pulse { 0%,100% {transform:scale(1)} 50% {transform:scale(1.35)} }
    h1 { font-size:1.6em; margin:10px; letter-spacing:3px; text-shadow:0 0 15px #0f0; }
    .lore { font-size:0.9em; margin:14px; opacity:0.85; line-height:1.5; }
    .btn { background:linear-gradient(45deg,#0f0,#00f); color:#000; border:3px solid #0f0; padding:14px 32px; font-size:1.2em; margin:10px auto; border-radius:14px; cursor:pointer; width:90%; max-width:340px; font-weight:bold; box-shadow:0 0 25px #0f0; transition:all .3s; }
    .btn:hover { transform:scale(1.05); box-shadow:0 0 35px #0f0; }
    .btn:disabled { opacity:0.5; cursor:not-allowed; }
    .hodl-area { width:100%; height:45vh; background:rgba(0,255,0,0.06); border:3px dashed #0f0; border-radius:18px; display:flex; align-items:center; justify-content:center; font-size:1.9em; margin:18px 0; position:relative; overflow:hidden; }
    .hodl-area::after { content:'🦑🦑🦑🦑🦑'; position:absolute; bottom:10px; font-size:1.4em; opacity:0.3; animation:swim 9s linear infinite; }
    @keyframes swim { from {transform:translateX(-100%)} to {transform:translateX(120%)} }
    .stats { margin:16px 0; font-size:1.1em; line-height:1.7; }
    .jackpot { color:#ff0; font-weight:bold; text-shadow:0 0 12px #ff0; }
    .hidden { display:none !important; }
    #status { margin:12px; font-size:1em; min-height:24px; color:#0f0; }
  </style>
</head>
<body>
  <div class="tentacle-core">🦑</div>
  <h1>STAR GLITCH: XYRATH-9</h1>
  <p class="lore">En las profundidades de <strong>Xyrath-9</strong>, <em>Kieran Star</em> halló la moneda rota.<br>Los <strong>Tentáculos Caóticos</strong> acechan. ¡HODL o perece!</p>
  <p id="status">Conecta tu wallet</p>

  <div id="connectSection">
    <button class="btn" id="phantomBtn">PHANTOM • SOLANA</button>
    <button class="btn" id="metamaskBtn">METAMASK • WORLD CHAIN</button>
  </div>

  <div id="entrySection" class="hidden">
    <button class="btn" id="freeEntryBtn">ENTRADA GRATUITA (VIP)</button>
    <button class="btn" id="payEntryBtn">PAGAR 0.1 $STARG</button>
  </div>

  <div id="gameSection" class="hidden">
    <div class="stats">
      Fragmentos: <span id="fragments">0</span><br>
      Streak: <span id="streak">0</span>s<br>
      Jackpot: <span class="jackpot">100 $STARG</span>
    </div>
    <div class="hodl-area" id="hodlArea"><div id="hodlText">¡HODLEA!</div></div>
    <button class="btn" id="cashoutBtn">COBRAR $STARG → @GoditsDimensional</button>
    <button class="btn" id="resetBtn">REINICIAR</button>
  </div>

  <script>
    const DEV_WALLET_SOLANA = '5ryaXDPvu1TkDWztTnqwq17fcj6AVVtw3bcrc1g1te6T';
    const VIP_WALLETS = [DEV_WALLET_SOLANA];
    let wallet = null, network = null, provider = null;
    let fragments = 0, streak = 0, interval = null, isHodling = false, enemyInterval = null;
    const HAS_PLAYED_KEY = 'hasPlayedBefore';
    const phantomBtn = document.getElementById("phantomBtn");

    // ==== PHANTOM MÓVIL + PC (100% FUNCIONAL 2025) ====
    phantomBtn.addEventListener("click", () => {
      const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

      // Si ya está inyectado (PC o regreso móvil)
      if (window.solana?.isPhantom) {
        connectPhantom();
        return;
      }

      if (!isMobile) {
        alert("Instala Phantom → phantom.app");
        return;
      }

      phantomBtn.disabled = true;
      document.getElementById("status").innerText = "Abriendo Phantom... pulsa CONECTAR";

      // UNIVERSAL LINK + requestAccounts=1 → aparece el botón CONNECT
      const appUrl = encodeURIComponent(location.href.split('?')[0]);
      const link = `https://phantom.app/ul/v1/connect?app_url=${appUrl}&redirect_link=${appUrl}&cluster=mainnet-beta&requestAccounts=1`;
      
      location.href = link;

      // Polling + eventos para cuando regresa
      const startPolling = setInterval(() => {
        if (window.solana?.isPhantom) {
          clearInterval(startPolling);
          connectPhantom();
        }
      }, 700);

      setTimeout(() => {
        clearInterval(startPolling);
        if (!wallet) {
          phantomBtn.disabled = false;
          document.getElementById("status").innerText = "No conectado. Pulsa otra vez";
        }
      }, 35000);
    });

    function connectPhantom() {
      window.solana.connect()
        .then(resp => {
          wallet = resp.publicKey.toString();
          network = "Solana";
          provider = window.solana;
          phantomBtn.disabled = false;
          showEntry();
        })
        .catch(() => {
          phantomBtn.disabled = false;
          document.getElementById("status").innerText = "Cancelado. Pulsa de nuevo";
        });
    }

    // ==== METAMASK (móvil y PC) ====
    document.getElementById("metamaskBtn").addEventListener("click", async () => {
      if (!window.ethereum) return alert("Instala MetaMask");
      try {
        const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
        wallet = accounts[0];
        network = "World Chain";
        provider = window.ethereum;
        showEntry();
      } catch { alert("Conexión cancelada"); }
    });

    function showEntry() {
      document.getElementById("status").innerText = `Conectado: ${wallet.slice(0,6)}...${wallet.slice(-4)}`;
      document.getElementById("connectSection").classList.add("hidden");
      document.getElementById("entrySection").classList.remove("hidden");
      loadState();
    }

    // ==== ENTRADA GRATIS / PAGO (igual que siempre) ====
    document.getElementById("freeEntryBtn").addEventListener("click", () => {
      if (!VIP_WALLETS.includes(wallet) && localStorage.getItem(HAS_PLAYED_KEY)) {
        return alert("Ya usaste tu entrada gratuita");
      }
      if (!VIP_WALLETS.includes(wallet)) localStorage.setItem(HAS_PLAYED_KEY, "true");
      startGame();
    });

    // (el resto del juego: pago, HODL, enemigos, cobrar, reset… exactamente igual que antes)

    document.getElementById("cashoutBtn").addEventListener("click", () => {
      if (fragments < 100) return alert("Mínimo 100 fragmentos");
      const amount = (fragments / 1000).toFixed(3);
      const msg = encodeURIComponent(`🦑 RETIRO $STARG 🦑\nCantidad: ${amount} $STARG\nRed: ${network}\nWallet: ${wallet}\n¡HODL ETERNO!`);
      open(`https://t.me/GoditsDimensional?text=${msg}`);
      alert("Solicitud enviada a @GoditsDimensional");
      resetGame();
    });

    // ==== Carga estado ====
    function loadState() {
      fragments = +localStorage.getItem('f') || 0;
      streak = +localStorage.getItem('s') || 0;
      document.getElementById("fragments").innerText = fragments;
      document.getElementById("streak").innerText = streak;
    }
    loadState();
  </script>
</body>
</html>
