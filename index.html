<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Star Glitch: XYRATH-9</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/@solana/web3.js@1.95.3/lib/index.iife.min.js"></script>
  <!-- Resto del estilo sin cambios -->
</head>
<body>
  <!-- HTML sin cambios -->
  <script>
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();

    let wallet, network, fragments = 0, streak = 0, interval;

    // CONECTAR PHANTOM CON openLink
    function connectPhantom() {
      try {
        // Usar una clave pública generada para la sesión
        const keypair = window.solanaWeb3.Keypair.generate();
        const dappKey = keypair.publicKey.toBase58();
        const session = Date.now().toString();
        const redirect = encodeURIComponent(window.location.origin); // Usar solo el origen

        const params = new URLSearchParams({
          app_url: window.location.origin,
          redirect_link: redirect,
          dapp_encryption_public_key: dappKey,
          cluster: 'mainnet-beta',
          session: session
        });

        const phantomLink = `https://phantom.app/ul/v1/connect?${params.toString()}`;
        console.log("Deep link generado:", phantomLink); // Para depuración

        // Usar Telegram.WebApp.openLink para abrir el enlace
        Telegram.WebApp.openLink(phantomLink, { try_instant_view: false });
      } catch (err) {
        console.error("Error en connectPhantom:", err);
        document.getElementById("status").innerText = "Error al abrir Phantom: " + err.message;
      }
    }

    // METAMASK (sin cambios, parece correcto)
    function connectMetaMask() {
      Telegram.WebApp.openLink('https://metamask.app.link/dapp/' + window.location.host);
    }

    // DETECTAR REGRESO DE PHANTOM
    window.addEventListener('load', () => {
      const params = new URLSearchParams(window.location.search);
      if (params.get('phantom_encryption_public_key')) {
        wallet = "Conectada (Solana)";
        network = "Solana";
        document.getElementById("status").innerText = `${network}: ${wallet}`;
        startGame();
      }
    });

    // POLLING PARA REGRESO
    setInterval(() => {
      const params = new URLSearchParams(window.location.search);
      if (params.get('phantom_encryption_public_key') && !wallet) {
        wallet = "Conectada (Solana)";
        network = "Solana";
        document.getElementById("status").innerText = `${network}: ${wallet}`;
        startGame();
      }
    }, 1000);

    function startGame() {
      document.getElementById("connectSection").classList.add("hidden");
      document.getElementById("gameSection").classList.remove("hidden");
      startHODL();
    }

    // Resto de las funciones (startHODL, startStreak, endStreak, addTentacle, cashOut) sin cambios
    function startHODL() {
      const area = document.getElementById("hodlArea");
      area.addEventListener("touchstart", startStreak);
      area.addEventListener("mousedown", startStreak);
      area.addEventListener("touchend", endStreak);
      area.addEventListener("mouseup", endStreak);
    }

    function startStreak() {
      streak = 0;
      document.getElementById("hodlText").innerText = "¡HODLEANDO!";
      interval = setInterval(() => {
        streak++;
        fragments += streak;
        document.getElementById("streak").innerText = streak;
        document.getElementById("fragments").innerText = fragments;
        if (streak % 10 === 0) addTentacle();
      }, 1000);
    }

    function endStreak() {
      clearInterval(interval);
      document.getElementById("hodlText").innerText = "¡HODLEA AQUÍ!";
      if (streak > 5) alert(`¡${streak}s! Ganaste ${(streak/10).toFixed(1)} $STARG`);
    }

    function addTentacle() {
      const t = document.createElement("div");
      t.innerText = "🦑"; t.style.position = "absolute"; t.style.fontSize = "3em";
      t.style.left = Math.random() * 80 + "%"; t.style.top = "-50px";
      t.style.animation = "fall 3s linear"; document.body.appendChild(t);
      setTimeout(() => t.remove(), 3000);
    }

    function cashOut() {
      if (fragments < 100) return alert("100 fragmentos mínimo");
      alert(`Cobras ${(fragments/1000).toFixed(3)} $STARG`);
    }

    const style = document.createElement('style');
    style.innerHTML = `@keyframes fall { from { top: -50px; } to { top: 100vh; } }`;
    document.head.appendChild(style);
  </script>
</body>
</html>
