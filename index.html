<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STAR GLITCH: XYRATH-9</title>
  <script src="https://unpkg.com/@solana/web3.js@1.95.3/lib/index.iife.min.js"></script>
  <script src="https://unpkg.com/web3@1.10.4/dist/web3.min.js"></script>
  <script src="https://unpkg.com/@solana/spl-token@0.4.8/lib/index.iife.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      background: #000; 
      color: #0f0; 
      font-family: 'Orbitron', monospace; 
      text-align: center; 
      overflow: hidden;
      animation: cosmicPulse 12s infinite;
    }
    @keyframes cosmicPulse { 0%,100% { filter: hue-rotate(0deg); } 50% { filter: hue-rotate(150deg); } }
    
    .tentacle-core { font-size: 6em; animation: pulse 1.5s infinite; text-shadow: 0 0 25px #0f0; margin: 20px 0; }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.35); } }
    
    h1 { font-size: 1.8em; margin: 12px; letter-spacing: 4px; text-shadow: 0 0 15px #0f0; }
    .lore { font-size: 0.95em; margin: 16px; opacity: 0.85; line-height: 1.5; }
    
    .btn { 
      background: linear-gradient(45deg, #0f0, #00f); 
      color: #000; 
      border: 3px solid #0f0; 
      padding: 16px 36px; 
      font-size: 1.3em; 
      margin: 12px auto; 
      border-radius: 14px; 
      cursor pointer; 
      width: 88%; 
      max-width: 360px;
      font-weight: bold;
      box-shadow: 0 0 25px #0f0;
      transition: all 0.3s ease;
    }
    .btn:hover { transform: scale(1.06); box-shadow: 0 0 40px #0f0; }
    .btn:active { transform: scale(0.94); }
    
    .hodl-area { 
      width: 100%; height: 50vh; background: rgba(0,255,0,0.06); 
      border: 3px dashed #0f0; border-radius: 18px; 
      display: flex; align-items: center; justify-content: center; 
      font-size: 2.1em; margin: 22px 0; position: relative; overflow: hidden;
      box-shadow: inset 0 0 30px rgba(0,255,0,0.2);
    }
    .hodl-area::after { 
      content: '🦑🦑🦑🦑🦑'; 
      position: absolute; bottom: 12px; font-size: 1.6em; opacity: 0.3; 
      animation: swim 9s linear infinite;
    }
    @keyframes swim { from { transform: translateX(-100%); } to { transform: translateX(120%); } }
    
    .stats { margin: 18px 0; font-size: 1.2em; line-height: 1.8; }
    .jackpot { color: #ff0; font-weight: bold; text-shadow: 0 0 12px #ff0; }
    .hidden { display: none; }
    #status { margin: 14px; font-size: 1.05em; min-height: 28px; color: #0f0; }

    .enemy { 
      position: absolute; 
      font-size: 2.5em; 
      color: #f00; 
      text-shadow: 0 0 15px #f00; 
      animation: fall 4s linear; 
      pointer-events: none;
    }
    @keyframes fall { from { top: -80px; } to { top: 100vh; } }
  </style>
</head>
<body>
  <div class="tentacle-core">🦑</div>
  <h1>STAR GLITCH: XYRATH-9</h1>
  <p class="lore">
    En las profundidades de <strong>Xyrath-9</strong>, <em>Kieran Star</em> halló la moneda rota.<br>
    Los <strong>Tentáculos Caóticos</strong> acechan. ¡HODL o perece!
  </p>
  <p id="status">Conecta tu alma al glitch</p>

  <div id="connectSection">
    <button class="btn" id="phantomBtn">PHANTOM • SOLANA</button>
    <button class="btn" id="metamaskBtn">METAMASK • WORLD CHAIN</button>
  </div>

  <div id="entrySection" class="hidden">
    <button class="btn" id="freeEntryBtn">ENTRADA GRATUITA</button>
    <button class="btn" id="payEntryBtn">PAGAR 0.1 $STARG</button>
  </div>

  <div id="gameSection" class="hidden">
    <div class="stats">
      Fragmentos: <span id="fragments">0</span><br>
      Streak: <span id="streak">0</span>s<br>
      Jackpot: <span class="jackpot">100 $STARG</span>
    </div>
    <div class="hodl-area" id="hodlArea"><div id="hodlText">¡HODLEA!</div></div>
    <button class="btn" id="cashoutBtn">COBRAR $STARG → @GoditsDimensional</button>
    <button class="btn" id="resetBtn">REINICIAR</button>
  </div>

  <script>
    const DEV_WALLET_SOLANA = '5ryaXDPvu1TkDWztTnqwq17fcj6AVVtw3bcrc1g1te6T';
    const DEV_WALLET_WORLD = '0xd7fa97a54fe292df8463e89b8dbf9e6d2ec14bc5';
    const SOLANA_CA = '3nhJUCbLwoT7w1iUWE1MUER1YbUmqJxeqBVpsBZFpump';
    const WORLD_CA = '0xa3Ad51ebd02690317b34f83329F2f9b4f84683';
    const SOLANA_RPC = 'https://api.mainnet-beta.solana.com';
    const SOLANA_DECIMALS = 6;
    const WORLD_DECIMALS = 18;

    const VIP_WALLETS = [DEV_WALLET_SOLANA, DEV_WALLET_WORLD.toLowerCase()];
    let provider, wallet, network, fragments = 0, streak = 0, interval, isHodling = false, enemyInterval;
    const HAS_PLAYED_KEY = 'hasPlayedBefore';

    document.getElementById("phantomBtn").addEventListener("click", async () => {
      if (!window.solana?.isPhantom) return alert("Phantom no detectado. Instálalo desde phantom.app");
      try {
        const resp = await window.solana.connect({ onlyIfTrusted: false });
        wallet = resp.publicKey.toString();
        network = "Solana";
        provider = window.solana;
        showEntry();
      } catch (e) { alert("Conexión cancelada"); }
    });

    document.getElementById("metamaskBtn").addEventListener("click", async () => {
      if (!window.ethereum) return alert("MetaMask no detectado. Instálalo desde metamask.io");
      try {
        const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
        wallet = accounts[0].toLowerCase();
        network = "World Chain";
        provider = window.ethereum;
        showEntry();
      } catch (e) { alert("Conexión cancelada"); }
    });

    function showEntry() {
      document.getElementById("status").innerText = `HODLer: ${wallet.slice(0,6)}...${wallet.slice(-4)}`;
      document.getElementById("connectSection").classList.add("hidden");
      document.getElementById("entrySection").classList.remove("hidden");
      loadState();
    }

    document.getElementById("freeEntryBtn").addEventListener("click", () => {
      const isVIP = VIP_WALLETS.includes(wallet) || VIP_WALLETS.includes(wallet.toLowerCase());
      const hasPlayed = localStorage.getItem(HAS_PLAYED_KEY);
      if (!isVIP && hasPlayed) {
        alert("Ya usaste tu entrada gratuita. Paga 0.1 $STARG.");
        return;
      }
      if (!isVIP) localStorage.setItem(HAS_PLAYED_KEY, 'true');
      startGame();
    });

    document.getElementById("payEntryBtn").addEventListener("click", async () => {
      document.getElementById("status").innerText = "Sacrificando...";
      const amount = 0.1 * 10 ** (network === "Solana" ? SOLANA_DECIMALS : WORLD_DECIMALS);
      try {
        if (network === "Solana") {
          const connection = new Solana.Connection(SOLANA_RPC, 'confirmed');
          const tx = new Solana.Transaction().add(
            SplToken.createTransferInstruction(
              SplToken.TOKEN_PROGRAM_ID,
              new Solana.PublicKey(wallet),
              new Solana.PublicKey(DEV_WALLET_SOLANA),
              new Solana.PublicKey(wallet),
              [],
              amount
            )
          );
          await provider.signAndSendTransaction(tx);
        } else {
          const web3 = new Web3(provider);
          const token = new web3.eth.Contract([{"inputs":[{"name":"_to","type":"address"},{"name":"_value","type":"uint256"}],"name":"transfer","outputs":[{"name":"","type":"bool"}],"type":"function"}], WORLD_CA);
          await token.methods.transfer(DEV_WALLET_WORLD, amount).send({ from: wallet });
        }
        startGame();
      } catch (err) {
        document.getElementById("status").innerText = "Ofrenda rechazada.";
      }
    });

    function startGame() {
      document.getElementById("entrySection").classList.add("hidden");
      document.getElementById("gameSection").classList.remove("hidden");
      startHODL();
      startEnemies();
    }

    function startHODL() {
      const area = document.getElementById("hodlArea");
      area.addEventListener("mousedown", () => { isHodling = true; startStreak(); });
      area.addEventListener("touchstart", e => { e.preventDefault(); isHodling = true; startStreak(); });
      area.addEventListener("mouseup", () => { isHodling = false; endStreak(); });
      area.addEventListener("touchend", () => { isHodling = false; endStreak(); });
    }

    function startStreak() {
      if (interval) return;
      streak = 0;
      document.getElementById("hodlText").innerText = "¡HODLEANDO!";
      interval = setInterval(() => {
        streak++;
        fragments += streak * (streak > 30 ? 2 : 1);
        document.getElementById("streak").innerText = streak;
        document.getElementById("fragments").innerText = fragments;
        saveState();
        if (streak % 10 === 0) spawnFriendlyTentacle();
      }, 1000);
    }

    function endStreak() {
      clearInterval(interval); interval = null;
      document.getElementById("hodlText").innerText = "¡HODLEA!";
      if (streak > 5) alert(`+${(streak/10).toFixed(1)} $STARG`);
      saveState();
    }

    function startEnemies() {
      enemyInterval = setInterval(() => {
        if (!isHodling && fragments > 0) {
          fragments = Math.floor(fragments * 0.9);
          document.getElementById("fragments").innerText = fragments;
          saveState();
          alert("¡Tentáculo Caótico te robó 10%!");
        }
        spawnEnemy();
      }, 8000 + Math.random() * 7000);
    }

    function spawnEnemy() {
      const e = document.createElement("div");
      e.className = "enemy";
      e.innerText = "🦑";
      e.style.left = Math.random() * 80 + "%";
      document.body.appendChild(e);
      setTimeout(() => e.remove(), 4000);
    }

    function spawnFriendlyTentacle() {
      const t = document.createElement("div");
      t.innerText = "🦑";
      t.style.position = "absolute"; t.style.fontSize = "3em"; t.style.color = "#0f0";
      t.style.left = Math.random() * 80 + "%"; t.style.top = "-60px";
      t.style.animation = "fall 3s linear"; t.style.textShadow = "0 0 15px #0f0";
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 3000);
    }

    // === COBRAR → @GoditsDimensional ===
    document.getElementById("cashoutBtn").addEventListener("click", () => {
      if (fragments < 100) return alert("Mínimo 100 fragmentos para cobrar");
      const amount = (fragments / 1000).toFixed(3);
      const message = encodeURIComponent(
        `🦑 RETIRO $STARG 🦑\n\n` +
        `Cantidad: ${amount} $STARG\n` +
        `Red: ${network}\n` +
        `Wallet: ${wallet}\n\n` +
        `¡HODL ETERNO!`
      );
      window.open(`https://t.me/GoditsDimensional?text=${message}`, '_blank');
      alert("Solicitud enviada a @GoditsDimensional");
      resetGame();
    });

    document.getElementById("resetBtn").addEventListener("click", resetGame);

    function resetGame() {
      clearInterval(interval); interval = null;
      clearInterval(enemyInterval);
      fragments = 0; streak = 0;
      document.getElementById("fragments").innerText = 0;
      document.getElementById("streak").innerText = 0;
      document.getElementById("gameSection").classList.add("hidden");
      document.getElementById("entrySection").classList.remove("hidden");
      document.getElementById("status").innerText = "Dimensión reiniciada.";
    }

    function saveState() { localStorage.setItem('f', fragments); localStorage.setItem('s', streak); }
    function loadState() { 
      fragments = +localStorage.getItem('f') || 0; 
      streak = +localStorage.getItem('s') || 0;
      document.getElementById("fragments").innerText = fragments;
      document.getElementById("streak").innerText = streak;
    }

    const style = document.createElement('style');
    style.innerHTML = `@keyframes fall { from { top: -60px; opacity: 1; } to { top: 100vh; opacity: 0; } }`;
    document.head.appendChild(style);

    loadState();
  </script>
</body>
</html>
