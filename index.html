<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>STAR GLITCH: XYRATH-9</title>
  <script src="https://unpkg.com/@solana/web3.js@1.95.3/lib/index.iife.min.js"></script>
  <script src="https://unpkg.com/web3@1.10.4/dist/web3.min.js"></script>
  <script src="https://unpkg.com/@solana/spl-token@0.4.8/lib/index.iife.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap');
    * { margin:0; padding:0; box-sizing:border-box; touch-action: manipulation; }
    body { background:#000; color:#0f0; font-family:'Orbitron',monospace; text-align:center; overflow:hidden; }
    .tentacle { font-size:5em; animation:pulse 1.5s infinite; }
    @keyframes pulse { 0%,100% {transform:scale(1)} 50% {transform:scale(1.4)} }
    h1 { font-size:1.8em; margin:10px; letter-spacing:3px; text-shadow:0 0 15px #0f0; }
    .lore { margin:15px; opacity:0.9; line-height:1.5; }
    .btn { background:linear-gradient(45deg,#0f0,#00f); color:#000; border:3px solid #0f0; padding:16px 32px; 
           font-size:1.3em; margin:12px auto; border-radius:15px; cursor:pointer; width:90%; max-width:360px;
           font-weight:bold; box-shadow:0 0 30px #0f0; transition:0.3s; }
    .btn:hover { transform:scale(1.05); box-shadow:0 0 40px #0f0; }
    #status { margin:15px; font-size:1.1em; color:#0f0; }
    .hidden { display:none !important; }

    /* JUEGO NAVE VS TENTÁCULOS */
    #gameCanvas { background:#000; width:100vw; height:60vh; border:3px dashed #0f0; margin:20px 0; }
    .stats { margin:15px 0; font-size:1.2em; }
    .jackpot { color:#ff0; font-weight:bold; }
  </style>
</head>
<body>
  <div class="tentacle">SQUID</div>
  <h1>STAR GLITCH: XYRATH-9</h1>
  <p class="lore">Pilota tu nave entre los tentáculos cósmicos.<br>¡Sobrevive = HODL!</p>
  <p id="status">Conectando wallet...</p>

  <div id="connectSection">
    <button class="btn" id="phantomBtn">PHANTOM • SOLANA</button>
    <button class="btn" id="metamaskBtn">METAMASK • WORLD CHAIN</button>
  </div>

  <div id="entrySection" class="hidden">
    <button class="btn" id="freeEntryBtn">ENTRADA GRATUITA (VIP)</button>
    <button class="btn" id="payEntryBtn">PAGAR 0.1 $STARG</button>
  </div>

  <div id="gameSection" class="hidden">
    <div class="stats">
      Fragmentos: <span id="fragments">0</span> | 
      Streak: <span id="streak">0</span>s | 
      Jackpot: <span class="jackpot">100 $STARG</span>
    </div>
    <canvas id="gameCanvas"></canvas>
    <button class="btn" id="cashoutBtn">COBRAR → @GoditsDimensional</button>
    <button class="btn" id="resetBtn">REINICIAR</button>
  </div>

  <script>
    const DEV_WALLET_SOLANA = 'Ccp1SJut7ycZbAFNtYjmmGcGUgx7Gipji4R5BvfqfaQS';
    const DEV_WALLET_WORLD = '0xd7fa97a54fe292df8463e89b8dbf9e6d2ec14bc5';
    const VIP_WALLETS = [DEV_WALLET_SOLANA, DEV_WALLET_WORLD.toLowerCase()];
    let wallet = null, network = null, provider = null;
    let fragments = 0, streak = 0, gameRunning = false;
    const HAS_PLAYED_KEY = 'xyrath9_played';

    // ================= PHANTOM MÓVIL DEFINITIVO =================
    document.getElementById("phantomBtn").addEventListener("click", async () => {
      if (window.solana?.isPhantom) {
        await connectPhantom();
        return;
      }

      const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      if (!isMobile) return alert("Instala Phantom desde phantom.app");

      // Generar claves efímeras (requeridas por Phantom v2)
      const { publicKey: dappKey } = await Solana.web3.Keypair.generate();
      const session = btoa(String.fromCharCode(...crypto.getRandomValues(new Uint8Array(32)))).slice(0,32);

      localStorage.setItem('dappKey', JSON.stringify(Array.from(dappKey.toBytes())));
      localStorage.setItem('session', session);

      const params = new URLSearchParams({
        dapp_encryption_public_key: Solana.web3.PublicKey.fromBase58(dappKey.toBase58()).toBase58(),
        cluster: 'mainnet-beta',
        app_url: encodeURIComponent(location.href),
        redirect_link: encodeURIComponent(location.href),
        session: session
      });

      const phantomDeepLink = `https://phantom.app/ul/v1/connect?${params.toString()}`;
      location.href = phantomDeepLink;

      document.getElementById("status").innerText = "Abriendo Phantom... Pulsa CONECTAR";
    });

    async function connectPhantom() {
      try {
        const resp = await window.solana.connect();
        wallet = resp.publicKey.toString();
        network = "Solana";
        provider = window.solana;
        document.getElementById("status").innerText = `Conectado: ${wallet.slice(0,6)}...${wallet.slice(-4)}`;
        document.getElementById("connectSection").classList.add("hidden");
        document.getElementById("entrySection").classList.remove("hidden");
      } catch (e) {
        alert("Conexión cancelada");
      }
    }

    // Detectar regreso de Phantom
    window.addEventListener("load", () => {
      if (window.solana?.isPhantom && localStorage.getItem('session')) {
        connectPhantom();
      }
    });

    // ================= METAMASK =================
    document.getElementById("metamaskBtn").addEventListener("click", async () => {
      if (!window.ethereum) return alert("Instala MetaMask");
      try {
        const accounts = await ethereum.request({ method: 'eth_requestAccounts' });
        wallet = accounts[0].toLowerCase();
        network = "World Chain";
        provider = ethereum;
        document.getElementById("status").innerText = `Conectado: ${wallet.slice(0,6)}...${wallet.slice(-4)}`;
        document.getElementById("connectSection").classList.add("hidden");
        document.getElementById("entrySection").classList.remove("hidden");
      } catch (e) { alert("Cancelado"); }
    });

    // ================= ENTRADA GRATIS / PAGA =================
    document.getElementById("freeEntryBtn").addEventListener("click", () => {
      const isVIP = VIP_WALLETS.includes(wallet);
      const hasPlayed = localStorage.getItem(HAS_PLAYED_KEY);
      if (!isVIP && hasPlayed) return alert("Ya usaste tu entrada gratuita");
      if (!isVIP) localStorage.setItem(HAS_PLAYED_KEY, 'true');
      startGame();
    });

    // ================= JUEGO NAVE VS TENTÁCULOS =================
    let shipX, tentacles = [], scoreTimer;

    function startGame() {
      document.getElementById("entrySection").classList.add("hidden");
      document.getElementById("gameSection").classList.remove("hidden");

      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");
      canvas.width = innerWidth;
      canvas.height = innerHeight * 0.6;

      shipX = canvas.width / 2;

      canvas.addEventListener("touchmove", e => {
        e.preventDefault();
        shipX = e.touches[0].clientX;
      });

      canvas.addEventListener("mousemove", e => {
        shipX = e.clientX;
      });

      fragments = 0;
      streak = 0;
      tentacles = [];
      gameRunning = true;

      scoreTimer = setInterval(() => {
        streak++;
        fragments += streak > 30 ? 2 : 1;
        document.getElementById("streak").innerText = streak;
        document.getElementById("fragments").innerText = fragments;
      }, 1000);

      spawnTentacle();
      requestAnimationFrame(gameLoop);
    }

    function spawnTentacle() {
      if (!gameRunning) return;
      tentacles.push({
        x: Math.random() * innerWidth,
        y: -100,
        speed: 2 + Math.random() * 3
      });
      setTimeout(spawnTentacle, 800 + Math.random() * 1200);
    }

    function gameLoop() {
      if (!gameRunning) return;
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0,0,canvas.width,canvas.height);

      // Nave
      ctx.fillStyle = "#0f0";
      ctx.fillRect(shipX-20, canvas.height-60, 40, 40);

      // Tentáculos
      ctx.fillStyle = "#f00";
      for (let i = tentacles.length-1; i >= 0; i--) {
        let t = tentacles[i];
        t.y += t.speed;
        ctx.fillRect(t.x-15, t.y, 30, 100);

        // Colisión
        if (t.y > canvas.height-100 && Math.abs(t.x - shipX) < 40) {
          alert(`¡Tentáculo te atrapó! Streak: ${streak}s`);
          endGame();
          return;
        }
        if (t.y > canvas.height+100) tentacles.splice(i,1);
      }

      requestAnimationFrame(gameLoop);
    }

    function endGame() {
      gameRunning = false;
      clearInterval(scoreTimer);
      clearTimeout(spawnTentacle);
    }

    document.getElementById("resetBtn").onclick = () => location.reload();

    document.getElementById("cashoutBtn").onclick = () => {
      if (fragments < 100) return alert("Mínimo 100 fragmentos");
      const amount = (fragments / 1000).toFixed(3);
      const msg = encodeURIComponent(
        `SQUID RETIRO $STARG\n\nCantidad: ${amount} $STARG\nRed: ${network}\nWallet: ${wallet}\n\n¡HODL ETERNO!`
      );
      open(`https://t.me/GoditsDimensional?text=${msg}`, '_blank');
      alert("Solicitud enviada!");
      location.reload();
    };
  </script>
</body>
</html>
